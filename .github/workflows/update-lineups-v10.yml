name: V10 - Mettre à jour les compositions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-v10-lineups
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Générer le cache Rennes–Marseille
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
        run: python update_match_lineups_v10.py

      - name: Publier le cache si modifié
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lineups-v10.json portraits-v10-cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans le cache."
            exit 0
          fi
          git commit -m "V10: actualiser les compositions"
          git pull --rebase origin main
          git push origin HEAD:main

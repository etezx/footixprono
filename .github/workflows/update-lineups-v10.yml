name: V10 - Compositions Ligue 1

on:
  workflow_dispatch:
  schedule:
    # Toutes les 2 h : assez fréquent pour capter les XI officiels sans gaspiller le quota gratuit.
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: footix-v10-lineups-ligue1
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer le cache Ligue 1
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
          V10_PAST_DAYS: '4'
          V10_FUTURE_DAYS: '3'
        run: python update_match_lineups_v10.py
      - name: Publier le cache si modifié
        run: |
          if git diff --quiet -- lineups-v10.json portraits-v10-cache.json; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lineups-v10.json portraits-v10-cache.json
          git commit -m "V10: actualiser les compositions Ligue 1"
          git pull --rebase origin main
          git push origin HEAD:main

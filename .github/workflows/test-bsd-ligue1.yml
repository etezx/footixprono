name: Test BSD Ligue 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bsd:
    runs-on: ubuntu-latest

    steps:
      - name: Test BSD Ligue 1 2026-27
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          BASE = "https://sports.bzzoiro.com/api/v2"
          LEAGUE_ID = 6

          key = os.environ.get("BSD_API_KEY", "").strip()
          if not key:
              print("ERREUR : le secret BSD_API_KEY est absent ou vide.")
              sys.exit(1)

          def get_json(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Token {key}",
                      "Accept": "application/json",
                      "User-Agent": "FootixProno/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print(f"ERREUR HTTP {e.code} sur {url}")
                  print(body[:1200])
                  raise
              except Exception as e:
                  print(f"ERREUR connexion sur {url} : {e}")
                  raise

          def list_items(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key_name in ("results", "events", "incidents"):
                      value = payload.get(key_name)
                      if isinstance(value, list):
                          return value
              return []

          print("=== TEST BSD / FOOTIX PRONO ===")

          # 1) Authentification + Ligue 1
          league = get_json(f"/leagues/{LEAGUE_ID}/")
          league_name = league.get("name") if isinstance(league, dict) else None
          country = league.get("country") if isinstance(league, dict) else None
          print(f"1. Connexion BSD : OK")
          print(f"   Ligue : {league_name or 'Ligue 1'} | Pays : {country or 'France'} | ID : {LEAGUE_ID}")

          # 2) Saison courante, sans ID codé en dur
          season = get_json(f"/leagues/{LEAGUE_ID}/season/")
          if not isinstance(season, dict) or not season.get("id"):
              print("ERREUR : impossible d'identifier la saison courante.")
              print(json.dumps(season, ensure_ascii=False)[:1000])
              sys.exit(2)

          season_id = season["id"]
          print(
              "2. Saison courante : OK | "
              f"{season.get('name', '?')} | year={season.get('year', '?')} | season_id={season_id}"
          )

          # On veut réellement la saison 2026/27.
          text = " ".join(str(season.get(k, "")) for k in ("name", "year", "start_date", "end_date"))
          if "2026" not in text:
              print("ERREUR : la saison courante retournée ne semble pas être 2026/27.")
              sys.exit(3)

          # 3) Classement
          standings = get_json(
              f"/leagues/{LEAGUE_ID}/standings/",
              {"season_id": season_id},
          )
          rows = []
          if isinstance(standings, dict):
              rows = standings.get("standings") or []
              if not rows and isinstance(standings.get("groups"), list):
                  for group in standings["groups"]:
                      if isinstance(group, dict):
                          rows.extend(group.get("standings") or group.get("rows") or [])
          print(f"3. Classement : OK | {len(rows)} lignes")
          if len(rows) < 18:
              print("ATTENTION : moins de 18 équipes détectées dans le classement.")

          # 4) Matchs de la saison
          fixtures = get_json(
              "/events/",
              {"league_id": LEAGUE_ID, "season_id": season_id, "limit": 200},
          )
          events = list_items(fixtures)
          print(f"4. Matchs Ligue 1 2026/27 : OK | {len(events)} matchs sur cette page")
          if not events:
              print("ERREUR : aucun match Ligue 1 trouvé pour la saison courante.")
              sys.exit(4)

          # Affiche quelques exemples
          for ev in events[:3]:
              if not isinstance(ev, dict):
                  continue
              home = ev.get("home_team_name") or (ev.get("home_team") or {}).get("name") if isinstance(ev.get("home_team"), dict) else ev.get("home")
              away = ev.get("away_team_name") or (ev.get("away_team") or {}).get("name") if isinstance(ev.get("away_team"), dict) else ev.get("away")
              print(f"   Exemple : {home or '?'} - {away or '?'} | statut={ev.get('status', '?')}")

          # 5) Endpoint LIVE : doit être accessible même s'il n'y a aucun match en cours
          live = get_json("/events/live/", {"league_id": LEAGUE_ID})
          live_events = list_items(live)
          print(f"5. Endpoint LIVE : OK | {len(live_events)} match(s) en cours actuellement")
          if live_events:
              sample = live_events[0]
              print(
                  "   LIVE exemple : "
                  f"{sample.get('home_score', '?')}-{sample.get('away_score', '?')} "
                  f"| minute={sample.get('current_minute', '?')} "
                  f"| période={sample.get('period', '?')}"
              )
          else:
              print("   Aucun match en direct au moment du test : c'est normal.")

          # 6) Incidents/buteurs : teste sur un match terminé avec au moins un but
          finished = []
          for ev in events:
              if not isinstance(ev, dict):
                  continue
              status = str(ev.get("status", "")).lower()
              hs = ev.get("home_score")
              aas = ev.get("away_score")
              if status == "finished" and isinstance(hs, int) and isinstance(aas, int) and hs + aas > 0:
                  finished.append(ev)

          if not finished:
              # Recherche ciblée si la première page ne contient pas de match terminé.
              fin_payload = get_json(
                  "/events/",
                  {
                      "league_id": LEAGUE_ID,
                      "season_id": season_id,
                      "status": "finished",
                      "limit": 50,
                  },
              )
              finished = [
                  ev for ev in list_items(fin_payload)
                  if isinstance(ev, dict) and isinstance(ev.get("id"), int)
              ]

          if not finished:
              print("6. Incidents/buteurs : NON TESTÉ | aucun match terminé trouvé.")
              sys.exit(5)

          test_event = finished[0]
          event_id = test_event.get("id")
          incidents_payload = get_json(f"/events/{event_id}/incidents/")
          incidents = list_items(incidents_payload)

          goal_like = []
          for inc in incidents:
              if not isinstance(inc, dict):
                  continue
              txt = " ".join(
                  str(inc.get(k, ""))
                  for k in ("type", "incident_type", "event_type", "incident_class", "text")
              ).lower()
              if "goal" in txt or "but" in txt:
                  goal_like.append(inc)

          print(
              f"6. Incidents/buteurs : OK | event_id={event_id} | "
              f"{len(incidents)} incident(s), {len(goal_like)} but(s) détecté(s)"
          )

          if incidents:
              print("   Clés d'un incident :", ", ".join(sorted(incidents[0].keys())))

          print("")
          print("✅ TOUS LES TESTS BSD ESSENTIELS SONT PASSÉS")
          print("Aucune donnée du dépôt n'a été modifiée.")
          PY

name: Mettre à jour les résultats

on:
  schedule:
    # Décalé des minutes rondes pour réduire le risque de retard GitHub Actions.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [footix-live-refresh]

permissions:
  contents: write

concurrency:
  group: footix-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre à jour les résultats récents
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python update_results.py

      - name: Générer gratuitement le bilan Footix si la journée est terminée
        run: python generate_review.py

      - name: Enregistrer les résultats, le live et le classement
        run: |
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json pronos.json live-results.json bsd-standings.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour résultats live Footix"
          git push origin main

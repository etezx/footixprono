name: Mettre à jour les résultats

on:
  schedule:
    # Passage principal toutes les 5 min, décalé des minutes rondes.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [footix-live-refresh]

permissions:
  contents: write

concurrency:
  group: footix-live-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier la clé BSD
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        shell: bash
        run: |
          if [ -z "$BSD_API_KEY" ]; then
            echo "ERREUR : le secret BSD_API_KEY est absent."
            exit 1
          fi

      - name: Rafraîchir les scores Footix
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          python update_results.py
          python generate_review.py

          git add schedule.json pronos.json live-results.json bsd-standings.json
          if git diff --cached --quiet; then
            echo "Aucun changement de données à publier."
            exit 0
          fi

          git commit -m "Mise à jour résultats live Footix"

          if ! git push origin HEAD:main; then
            echo "Le dépôt a changé pendant le rafraîchissement : retry propre."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

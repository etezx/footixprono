name: Mettre à jour les résultats

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [footix-live-refresh]

permissions:
  contents: write

concurrency:
  group: footix-live-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier les secrets
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "$BSD_API_KEY" ]; then
            echo "ERREUR : BSD_API_KEY est absent."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERREUR : SUPABASE_SERVICE_ROLE_KEY est absent."
            exit 1
          fi

      - name: Rafraîchir le live 3 fois
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://brjwujgtkyxzyytkwftw.supabase.co
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          for pass in 1 2 3; do
            echo "=== Passage live BSD $pass/3 ==="
            python update_results.py
            python generate_review.py
            python sync_live_results_supabase.py

            # Publication immédiate : le site peut voir chaque nouvel état.
            git add schedule.json pronos.json live-results.json bsd-standings.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Footix passage $pass"
              if ! git push origin HEAD:main; then
                git fetch origin main
                git rebase origin/main
                git push origin HEAD:main
              fi
            fi

            if [ "$pass" -lt 3 ]; then
              sleep 60
            fi
          done

name: Mettre à jour les résultats

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre à jour les résultats récents
        run: python update_results.py

      - name: Générer gratuitement le bilan Footix si la journée est terminée
        run: python generate_review.py

      - name: Enregistrer les résultats et le bilan
        run: |
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json pronos.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour résultats et bilan Footix"
          git push origin main

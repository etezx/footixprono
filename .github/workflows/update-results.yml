name: Mettre à jour les résultats LIVE

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre à jour LIVE, résultats, buteurs et classements BSD
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python update_results.py

      - name: Générer gratuitement le bilan Footix si la journée est terminée
        run: python generate_review.py

      - name: Enregistrer les données actualisées
        run: |
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json pronos.json live-results.json bsd-standings.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Mise à jour Footix Live"
          git pull --rebase origin main
          git push origin main

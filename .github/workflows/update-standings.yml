name: Mettre à jour le classement

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre à jour les données
        run: python update_standings.py

      - name: Vérifier que le classement n'est pas vide
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("standings.json").read_text(encoding="utf-8"))
          teams = data.get("teams", [])
          assert len(teams) >= 10, f"Classement incomplet: {len(teams)} équipes"
          print(f"Classement vérifié: {len(teams)} équipes, {sum(int(t.get('p', 0) or 0) for t in teams)} matchs-équipe")
          PY

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "footix-prono-bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.json
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour automatique du classement"
          git push origin main

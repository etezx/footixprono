name: Surveillance du live Footix

on:
  schedule:
    # Filet de sécurité toutes les 5 min, décalé du workflow principal.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-live-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier si les données sont trop anciennes
        id: stale
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          age_minutes = None
          live = False
          stale = True

          try:
              data = json.loads(Path("live-results.json").read_text(encoding="utf-8"))
              stamp = str(data.get("generatedAt") or data.get("updatedAt") or "").strip()
              if stamp:
                  dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  age_minutes = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60

              for e in data.get("events") or []:
                  try:
                      league_id = int(e.get("leagueId") or 0)
                  except Exception:
                      league_id = 0
                  if league_id in (6, 7) and bool(e.get("live")) and not bool(e.get("completed")):
                      live = True
                      break

              # Si un fichier croit encore qu'un match est live, 4 min max.
              # Hors live, on garde quand même un contrôle afin de récupérer le coup de sifflet final.
              limit = 4 if live else 15
              stale = age_minutes is None or age_minutes > limit
          except Exception as exc:
              print(f"Lecture live-results impossible: {exc}")

          print(f"Âge: {age_minutes:.1f} min" if age_minutes is not None else "Âge: inconnu")
          print(f"Live détecté: {live}")
          print(f"Rattrapage nécessaire: {stale}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Rattraper les données
        if: steps.stale.outputs.stale == 'true'
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BSD_API_KEY" ]; then
            echo "ERREUR : BSD_API_KEY est absent."
            exit 1
          fi

          git config user.name "footix-prono-watchdog"
          git config user.email "actions@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          python update_results.py
          python generate_review.py

          git add schedule.json pronos.json live-results.json bsd-standings.json
          if git diff --cached --quiet; then
            echo "BSD ne renvoie aucun changement à publier."
            exit 0
          fi

          git commit -m "Rattrapage automatique du live Footix"

          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

name: Surveillance du live Footix

on:
  schedule:
    # Filet de sécurité à des minutes différentes du workflow principal.
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footix-data-updates
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier si les données live sont trop anciennes
        id: stale
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("live-results.json")
          stale = True
          age_minutes = None

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              stamp = str(data.get("generatedAt") or "").strip()
              if stamp:
                  dt = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                  age_minutes = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds() / 60
                  stale = age_minutes > 12
          except Exception as exc:
              print(f"Lecture live-results impossible: {exc}")
              stale = True

          print(f"Âge des données: {age_minutes:.1f} min" if age_minutes is not None else "Âge des données: inconnu")
          print("Relance nécessaire:", stale)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Relancer BSD si le live est en retard
        if: steps.stale.outputs.stale == 'true'
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python update_results.py

      - name: Générer le bilan si nécessaire
        if: steps.stale.outputs.stale == 'true'
        run: python generate_review.py

      - name: Enregistrer le rattrapage
        if: steps.stale.outputs.stale == 'true'
        run: |
          git config user.name "footix-prono-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json pronos.json live-results.json bsd-standings.json
          git diff --cached --quiet && exit 0
          git commit -m "Rattrapage automatique du live Footix"
          git push origin main

name: Mettre à jour le calendrier

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: write

concurrency:
  group: footix-data-update
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mettre à jour les dates et horaires
        run: python update_schedule.py
      - name: Publier si le calendrier a changé
        run: |
          if git diff --quiet -- schedule.json; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "Footix Prono Bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git commit -m "Mise à jour automatique du calendrier"
          git pull --rebase origin main
          git push origin main

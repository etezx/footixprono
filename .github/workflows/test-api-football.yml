name: Test API-Football

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api-football:
    runs-on: ubuntu-latest

    steps:
      - name: Test API-Football Ligue 1
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          key = os.environ.get("API_FOOTBALL_KEY", "").strip()
          if not key:
              print("ERREUR : le secret API_FOOTBALL_KEY est absent ou vide.")
              sys.exit(1)

          params = urllib.parse.urlencode({
              "league": 61,
              "season": 2026,
          })
          url = f"https://v3.football.api-sports.io/fixtures?{params}"

          req = urllib.request.Request(
              url,
              headers={
                  "x-apisports-key": key,
                  "Accept": "application/json",
                  "User-Agent": "FootixProno/1.0",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
                  headers = response.headers
          except Exception as exc:
              print(f"ERREUR connexion API-Football : {exc}")
              sys.exit(1)

          errors = data.get("errors")
          if errors:
              print("ERREUR API :", errors)
              sys.exit(1)

          fixtures = data.get("response", [])
          results = data.get("results", len(fixtures))

          print("Connexion API-Football : OK")
          print("Ligue testée : Ligue 1 (ID 61)")
          print("Saison testée : 2026")
          print(f"Matchs récupérés : {results}")

          # Les noms exacts des en-têtes peuvent varier selon l'infrastructure.
          remaining = (
              headers.get("x-ratelimit-requests-remaining")
              or headers.get("X-RateLimit-Requests-Remaining")
              or headers.get("x-ratelimit-remaining")
          )
          limit = (
              headers.get("x-ratelimit-requests-limit")
              or headers.get("X-RateLimit-Requests-Limit")
              or headers.get("x-ratelimit-limit")
          )

          if remaining is not None:
              print(f"Quota restant : {remaining}" + (f" / {limit}" if limit else ""))
          else:
              print("Quota restant : non communiqué dans les en-têtes de cette réponse")

          if not fixtures:
              print("ATTENTION : connexion OK, mais aucun match n'a été retourné pour Ligue 1 / saison 2026.")
              print("Cela peut indiquer une limitation du plan gratuit ou des données de saison non disponibles.")
              sys.exit(2)

          first = fixtures[0]
          teams = first.get("teams", {})
          home = teams.get("home", {}).get("name", "?")
          away = teams.get("away", {}).get("name", "?")
          date = first.get("fixture", {}).get("date", "?")
          print(f"Exemple : {home} - {away} | {date}")
          print("TEST TERMINÉ AVEC SUCCÈS")
          PY
